# Diagram of the 3 OS-level xkb layouts (Programmer Dvorak / US QWERTY /
# Slovenian QWERTZ, from niri's `input.keyboard.xkb`) as they land on a
# physical Lily58's keys. The Lily58's own QMK firmware is stock QWERTY —
# only the OS-level layout changes which character each physical key sends.
#
# Row 1-3 (letters) and the number row were derived from the real compiled
# xkb keymaps (`xkbcli compile-keymap --layout us --variant dvp`, etc.),
# not guessed. "?" placeholders mark keys whose QMK binding isn't verified
# (the extra symbol key at the inner end of the bottom row, and the full
# thumb cluster) — replace them with real labels once known.
#
# Physical key order (from lily58/rev1's QMK info.json, 58 keys, 0-indexed):
#   0-5   / 6-11   : row 1 (number row), left / right
#   12-17 / 18-23  : row 2 (qwert row), left / right
#   24-29 / 30-35  : row 3 (asdfg row), left / right
#   36-42 / 43-49  : row 4 (zxcv row, 7 keys/side incl. inner symbol key), left / right
#   50-53 / 54-57  : thumb cluster (4 keys/side, outer one rotated), left / right
#
# Regenerate after editing this file or niri's xkb layout/variant list:
#   keymap -c nord-draw-config.yaml draw -k lily58/rev1 lily58-keymap.yaml -s <layer> \
#       | rsvg-convert --background-color '#2e3440' -o <layer>.png

layers:
  qwerty:
    - ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "=", "Tab", "q", "w", "e", "r", "t", "y", "u", "i", "o", "p", "Bspc", "Esc", "a", "s", "d", "f", "g", "h", "j", "k", "l", ";", "'", "Shift", "z", "x", "c", "v", "b", "?", "?", "n", "m", ",", ".", "/", "Shift", "?", "?", "?", "?", "?", "?", "?", "?"]
  dvorak:
    - ["&", "[", "{", "}", "(", "=", "*", ")", "+", "]", "!", "#", "Tab", ";", ",", ".", "p", "y", "f", "g", "c", "r", "l", "Bspc", "Esc", "a", "o", "e", "u", "i", "d", "h", "t", "n", "s", "-", "Shift", "'", "q", "j", "k", "x", "?", "?", "b", "m", "w", "v", "z", "Shift", "?", "?", "?", "?", "?", "?", "?", "?"]
  qwertz_si:
    - ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "'", "+", "Tab", "q", "w", "e", "r", "t", "z", "u", "i", "o", "p", "Bspc", "Esc", "a", "s", "d", "f", "g", "h", "j", "k", "l", "č", "ć", "Shift", "y", "x", "c", "v", "b", "?", "?", "n", "m", ",", ".", "-", "Shift", "?", "?", "?", "?", "?", "?", "?", "?"]
