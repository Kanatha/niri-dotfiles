# Nord palette hardcoded from ~/.config/colors/colors.css (tmux can't read
# CSS/KDL, so keep these in sync by hand if the palette ever changes):
#   bg #2e3440  bg-alt #3b4252  fg #eceff4  fg-dim #d8dee9
#   accent #88c0d0  accent-strong #5e81ac  red #bf616a  green #a3be8c
#   yellow #ebcb8b

# Prefix: Ctrl+a instead of the default Ctrl+b (easier reach, screen-compatible).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Basics
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Intuitive split keys (open in the same working directory)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-motion pane navigation (after prefix, so it never collides with
# normal Ctrl-h/j/k/l terminal input like backspace/newline).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-motion pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim motions in copy mode (prefix+[ to enter, v to select, y to yank)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Status bar, styled to match the Nord rice (waybar/wofi)
set -g status-style bg=#2e3440,fg=#eceff4
set -g status-left-length 20
set -g status-left "#[bg=#88c0d0,fg=#2e3440,bold] #S #[bg=#2e3440,fg=#88c0d0]"
set -g status-right "#[fg=#4c566a]#[bg=#3b4252,fg=#d8dee9] %a %d %b #[bg=#3b4252,fg=#88c0d0,bold]%H:%M "
set -g status-right-length 40

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#5e81ac,fg=#eceff4,bold] #I:#W "

set -g pane-border-style fg=#4c566a
set -g pane-active-border-style fg=#88c0d0

set -g message-style bg=#88c0d0,fg=#2e3440
